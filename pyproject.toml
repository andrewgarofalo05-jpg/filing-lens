[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filing-lens"
version = "0.1.0"
description = "Local-first SEC filing research with auditable evidence and financial arithmetic"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["beautifulsoup4>=4.12,<5", "requests>=2.32.4,<3", "streamlit>=1.66,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/filing_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
