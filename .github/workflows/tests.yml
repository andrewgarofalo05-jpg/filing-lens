name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run --frozen python -m ruff check .
      - run: uv run --frozen python -m ruff format --check .
      - run: uv run --frozen python -m pytest
      - run: uv run --frozen python scripts/evaluate.py
      - run: uv build
